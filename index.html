<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ごっくんアニメ</title>
<style>
:root{--bg:#f2faf7;--card:#fff;--ink:#1d2b33;--sub:#52666f;--main:#0f8a7a;--main-dark:#0a6558;--line:#cfe3dd;--bad:#c23b4a;--accent:#ffb52e}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;font-size:18px;line-height:2;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:12px 16px 40px}
rt{font-size:.5em;color:var(--sub);font-weight:normal}
body.no-ruby rt{display:none}
.screen{display:none}
.screen.show{display:block}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px 18px;box-shadow:0 4px 14px rgba(15,138,122,.08)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:block;width:100%;min-height:56px;padding:8px 14px;border:none;border-radius:16px;background:var(--main);color:#fff;font-size:20px;font-weight:bold;box-shadow:0 4px 0 var(--main-dark)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--main-dark)}
.btn rt{color:#d9f3ee}
.btn.ghost{background:#fff;color:var(--main-dark);border:2px solid var(--main);box-shadow:none;font-size:17px;min-height:48px}
.btn.ghost rt{color:var(--sub)}
.note{font-size:14px;line-height:1.8;color:var(--sub);margin-top:14px}
.advice{text-align:left;background:#fff8e6;border:2px solid #f3d999;border-radius:16px;padding:10px 14px;margin-top:16px;font-size:16px;line-height:1.9}

/* メニュー */
#menu{text-align:center}
.hero{display:inline-block;animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#menu h1{font-size:34px;line-height:1.4;color:var(--main-dark)}
#menu .lead{font-size:19px;font-weight:bold;margin-bottom:6px}
#menu .intro{text-align:left;margin-bottom:14px}
.story-btn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:10px 16px;border:3px solid;border-radius:18px;background:#fff;text-align:left;line-height:1.6}
.story-btn .ico{font-size:40px;line-height:1}
.story-btn b{display:block;font-size:20px}
.story-btn small{display:block;font-size:15px;color:var(--sub)}
.story-btn.ok{border-color:var(--main);background:#e8f7f2}
.story-btn.ok b{color:var(--main-dark)}
.story-btn.ng{border-color:#e7889a;background:#fdeef1}
.story-btn.ng b{color:var(--bad)}
.story-btn:active{transform:translateY(2px)}
.row{display:flex;gap:10px;margin-top:16px}

/* プレイヤー */
#top{display:flex;align-items:center;gap:10px;margin-bottom:8px;line-height:1.4}
#btnBack{flex:none;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-size:15px;font-weight:bold;color:var(--main-dark)}
#storyTitle{font-size:19px;font-weight:bold;color:var(--main-dark)}
#stage{position:relative;border:2px solid var(--line);border-radius:20px;overflow:hidden;background:#fff8ec}
#scene{display:block;width:100%;height:auto}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px;background:rgba(255,253,247,.95);text-align:center;font-weight:bold;font-size:18px;line-height:2;overflow:auto}
.ov .big{animation:bounce 1.2s ease-in-out infinite}
.ov h2{font-size:23px;line-height:1.5;color:var(--main-dark)}
.ov h2.ng{color:var(--bad)}
.ov p{max-width:24em}
.tips{list-style:none;text-align:left;font-size:19px}
.tips li{padding:2px 0}
#seek{width:100%;margin:10px 0 4px;accent-color:var(--main);height:28px}
#ctrl{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
#ctrl button{min-height:52px;border-radius:14px;border:2px solid var(--main);background:#fff;color:var(--main-dark);font-size:17px;font-weight:bold;line-height:1.3}
#ctrl #btnPlay{background:var(--main);color:#fff;box-shadow:0 3px 0 var(--main-dark);font-size:19px}
#endBox{display:none;margin-top:12px}
#endBox.show{display:block}
#endBox .btn+.btn{margin-top:10px}
</style>
</head>
<body>

        <span class="ico" aria-hidden="true">🍙</span>

<script>
const $=id=>document.getElementById(id);
const ruby=s=>s.replace(/\{([^|}]+)\|([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const NS='http://www.w3.org/2000/svg';
const lerp=(a,b,p)=>a+(b-a)*p;
const ease=p=>.5-.5*Math.cos(Math.PI*p);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

// キーフレーム [[時間, 値], ...] をなめらかにつなぐ
function kv(tr,t,def=0){
  if(!tr||!tr.length) return def;
  if(t<=tr[0][0]) return tr[0][1];
  for(let i=0;i<tr.length-1;i++){
    const a=tr[i],b=tr[i+1];
    if(t<b[0]) return a[1]+(b[1]-a[1])*ease((t-a[0])/(b[0]-a[0]));
  }
  return tr[tr.length-1][1];
}
function step(list,t,def){let v=def;for(const [tt,x] of list){if(t>=tt) v=x; else break}return v}

/* ---------- おにぎりくん ---------- */
function onigiri(){

  <rect x="-18" y="11" width="36" height="27" rx="2" fill="#1f3d2b"/>

  <g data-face="happy"><ellipse cx="-11" cy="-6" rx="3.6" ry="4.6" fill="#3a2a2a"/><ellipse cx="11" cy="-6" rx="3.6" ry="4.6" fill="#3a2a2a"/><circle cx="-10" cy="-8" r="1.4" fill="#fff"/><circle cx="12" cy="-8" r="1.4" fill="#fff"/><path d="M-6,3 Q0,10 6,3" stroke="#3a2a2a" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g data-face="wow"><circle cx="-11" cy="-7" r="5" fill="#3a2a2a"/><circle cx="11" cy="-7" r="5" fill="#3a2a2a"/><circle cx="-9.5" cy="-9" r="1.8" fill="#fff"/><circle cx="12.5" cy="-9" r="1.8" fill="#fff"/><ellipse cx="0" cy="6" rx="3.6" ry="4.6" fill="#8a2b3a"/></g>
  <g data-face="scared"><circle cx="-11" cy="-6" r="5.5" fill="#fff" stroke="#3a2a2a" stroke-width="2"/><circle cx="11" cy="-6" r="5.5" fill="#fff" stroke="#3a2a2a" stroke-width="2"/><circle cx="-11" cy="-5" r="2.2" fill="#3a2a2a"/><circle cx="11" cy="-5" r="2.2" fill="#3a2a2a"/><path d="M-17,-16 L-7,-13 M17,-16 L7,-13" stroke="#3a2a2a" stroke-width="2.5" stroke-linecap="round"/><path d="M-8,6 q2,-3 4,0 q2,3 4,0 q2,-3 4,0 q2,3 4,0" stroke="#3a2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M28,-20 q-5,7 0,9 q5,-2 0,-9 Z" fill="#7cc7ff"/></g>
  <g data-face="dizzy"><path d="M-15,-10 L-7,-2 M-7,-10 L-15,-2 M7,-10 L15,-2 M15,-10 L7,-2" stroke="#3a2a2a" stroke-width="3" stroke-linecap="round"/><ellipse cx="0" cy="6" rx="4.5" ry="3.5" fill="#8a2b3a"/></g>
  <g data-face="relief"><path d="M-15,-4 Q-11,-10 -7,-4 M7,-4 Q11,-10 15,-4" stroke="#3a2a2a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M-7,2 Q0,11 7,2 Z" fill="#8a2b3a" stroke="#3a2a2a" stroke-width="2" stroke-linejoin="round"/></g>`;
}
function setFace(root,face){root.querySelectorAll('[data-face]').forEach(g=>{g.style.display=g.dataset.face===face?'':'none'})}
function onigiriSVG(face,size){
  const d=document.createElement('div');
  d.innerHTML=`<svg viewBox="-50 -50 100 100" width="${size}" height="${size}" aria-hidden="true">${onigiri()}</svg>`;
  setFace(d,face);
  return d.innerHTML;
}

/* ---------- おはなし(タイムライン) ---------- */
const TIPS='<ul class="tips"><li>🦷 よく かんで {食|た}べる</li><li>🥄 ひとくちは {小|ちい}さめに</li><li>🤐 おしゃべりは ごっくん してから</li><li>🪑 しせいを よくして {食|た}べる</li></ul>';
const STORIES={

// 動きのタイムライン(元の時間)を remap の [元の時間, 新しい時間] に合わせて詰める。points は新しい時間で書いてある
for(const S of Object.values(STORIES)){
  const R=S.remap,M=x=>{
    for(let i=0;i<R.length-1;i++) if(x<R[i+1][0]) return R[i][1]+(x-R[i][0])*(R[i+1][1]-R[i][1])/(R[i+1][0]-R[i][0]);
    return R[R.length-1][1]+(x-R[R.length-1][0]);
  };
  const mapPairs=arr=>arr.forEach(p=>{p[0]=M(p[0])});
  mapPairs(S.faces);mapPairs(S.sfx);
  for(const n in S.k) mapPairs(S.k[n]);
  S.dur=M(S.dur);S.outroAt=M(S.outroAt);S.introEnd=M(S.introEnd);
}

/* ---------- 図の じゅんび ---------- */
const world=$('world'),tongueEl=$('tongue'),velumG=$('velumG'),lar=$('lar'),epiG=$('epiG');
function tonguePath(tb,tt){
  return `M98,206 C120,${200-14*tt} 170,${200-6*tt} 200,207 C${220+8*tb},213 ${228+18*tb},232 ${226+24*tb},262 C${224+20*tb},288 ${216+10*tb},306 210,322 C204,330 196,332 190,330 L150,306 C130,290 110,262 100,240 Z`;
}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs) e.setAttribute(k,attrs[k]);if(parent) parent.appendChild(e);return e}

function mkArrows(parent,n,color){
  const a=[];for(let i=0;i<n;i++) a.push(el('path',{d:'M-5,-6 L4,0 L-5,6',fill:'none',stroke:color,'stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round'},parent));
  return a;
}
const airP=$('airPath'),coughP=$('coughPath');
const airLen=airP.getTotalLength(),coughLen=coughP.getTotalLength();
const airArr=mkArrows($('airArrows'),8,'#1e6fd0'),coughArr=mkArrows($('coughArrows'),9,'#ffffff');
function placeArrows(arr,path,len,offset,op){
  const sp=len/arr.length;
  arr.forEach((a,i)=>{
    if(op<=0){a.setAttribute('opacity',0);return}
    const s=((offset+i*sp)%len+len)%len,p=path.getPointAtLength(s),q=path.getPointAtLength(Math.min(len,s+2));
    const ang=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI;
    a.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
    a.setAttribute('opacity',(op*clamp(Math.min(s/25,(len-s)/25))).toFixed(2));
  });
}
// スイッチの ぎざぎざ
(()=>{let d='';for(let i=0;i<24;i++){const r=i%2?50:66,a=Math.PI*2*i/24;d+=(i?'L':'M')+(Math.cos(a)*r*1.35).toFixed(1)+','+(Math.sin(a)*r).toFixed(1)}$('swFx').firstElementChild.setAttribute('d',d+'Z')})();

/* ---------- おと ---------- */
let AC=null,soundOn=false;
function ac(){
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C) return null;AC=new C()}
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f0,f1,d,type='sine',v=.18,delay=0){
  const a=ac();if(!a) return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);
}
function noise(d,v,freq,delay=0){
  const a=ac();if(!a) return;
  const t=a.currentTime+delay,len=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=buf;f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;g.gain.value=v;
  s.connect(f).connect(g).connect(a.destination);s.start(t);
}
const SFX={
  chew:()=>{tone(300,220,.08,'triangle',.12);tone(320,240,.08,'triangle',.12,.15)},
  slip:()=>tone(700,300,.4,'triangle',.12),
  pop:()=>{tone(500,1200,.15,'square',.07);tone(900,1800,.2,'sine',.12,.12)},
  up:()=>tone(300,700,.35,'sine',.16),
  tap:()=>tone(900,500,.08,'square',.06),
  gulp:()=>tone(320,110,.3,'sine',.25),
  slide:()=>tone(900,200,.9,'triangle',.12),
  ding:()=>{tone(880,880,.5,'sine',.15);tone(1320,1320,.6,'sine',.12,.15)},
  warn:()=>{tone(260,250,.18,'square',.08);tone(260,250,.18,'square',.08,.25)},
  cough:()=>{noise(.16,.6,900);noise(.12,.5,700,.2)},
  laugh:()=>{[0,.15,.3].forEach(d=>tone(560,440,.1,'triangle',.08,d))}
};

/* ---------- さいせい ---------- */
let story=null,t=0,playing=false,speed=1,lastTs=0,curFace='',curPoint=null,dragging=false;

function render(){
  const S=story,K=S.k,v=n=>kv(K[n],t,n==='cy'?200:0);
  const sh=reduceMotion?0:v('shake');
  world.setAttribute('transform',sh?`translate(${(Math.sin(t*70)*3*sh).toFixed(1)} ${(Math.cos(t*53)*2.4*sh).toFixed(1)})`:'');
  tongueEl.setAttribute('d',tonguePath(v('tb'),v('tt')));
  velumG.setAttribute('transform',`translate(203 174) rotate(${lerp(58,-12,v('velum')).toFixed(1)})`);
  const e=v('e');
  const lt=`translate(${(-6*e).toFixed(2)} ${(-26*e).toFixed(2)})`;
  lar.setAttribute('transform',lt);
  epiG.setAttribute('transform',`translate(206 338) rotate(${lerp(20,100,v('ep')).toFixed(1)})`);
  const wf=5+10*v('vf');
  $('vfL').setAttribute('d',`M198,371 L${198+wf},379 L198,387 Z`);
  $('vfR').setAttribute('d',`M228,371 L${228-wf},379 L228,387 Z`);
  const uw=2.5+17*v('ues');
  $('ues').setAttribute('x',250-uw/2);$('ues').setAttribute('width',uw);
  const A=v('A'),cy=v('cy');
  let d='M296,104 L262,104';
  for(let y=104;y<=560;y+=6) d+=` L${(262-A*Math.exp(-(((y-cy)/24)**2))).toFixed(1)},${y}`;
  $('wall').setAttribute('d',d+' L296,560 Z');
  const dg=v('danger');
  $('danger').setAttribute('opacity',(dg*(.35+.25*Math.sin(t*10))).toFixed(2));
  const m=v('mouth'),lg=v('laugh');
  $('mouthO').setAttribute('opacity',m>0?1:0);
  $('mouthO').setAttribute('rx',(2+5*m*(lg>0?.7+.3*Math.sin(t*18):1)).toFixed(1));
  $('mouthO').setAttribute('ry',(2+6*m*(lg>0?.7+.3*Math.sin(t*18):1)).toFixed(1));
  $('stopBadge').setAttribute('opacity',v('stop'));
  $('slowBadge').setAttribute('opacity',v('slow'));
  $('laughTx').setAttribute('opacity',lg);
  $('coughTx').setAttribute('opacity',v('cgh')*(Math.sin(t*14)>-.3?1:.25));
  const sw=v('sw');
  $('swFx').setAttribute('opacity',sw);
  $('swFx').setAttribute('transform',`translate(200 150) scale(${(.4+.6*sw+.05*Math.sin(t*12)*sw).toFixed(3)}) rotate(${(-6+3*Math.sin(t*8)).toFixed(1)})`);
  placeArrows(airArr,airP,airLen,t*45,v('air')*.9);
  placeArrows(coughArr,coughP,coughLen,t*260,v('cgh'));

  // おにぎりくん
  let bx=v('bx')||150,by=v('by')||190;
  const moving=Math.abs(kv(K.by,t+.05,0)-kv(K.by,t,0))+Math.abs(kv(K.bx,t+.05,0)-kv(K.bx,t,0))>.2;
  if(!moving) by+=1.5*Math.sin(t*4);
  const ch=v('chew')*Math.sin(t*14),sq=v('squ');
  const sx=(1-.15*sq)*(1+.1*ch),sy=(1+.18*sq)*(1-.1*ch);
  const rot=v('rot')+(moving?6*Math.sin(t*9):3*Math.sin(t*3));
  $('bolus').setAttribute('opacity',v('bop'));
  $('bulge').setAttribute('cx',bx);$('bulge').setAttribute('cy',by);$('bulge').setAttribute('opacity',v('bulge'));
  $('bchar').setAttribute('transform',`translate(${bx.toFixed(1)} ${by.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${(.31*sx).toFixed(3)} ${(.31*sy).toFixed(3)})`);
  const face=step(S.faces,t,'happy');
  if(face!==curFace){setFace($('bchar'),face);curFace=face}

  // ポイントの ふきだし
  const P=S.points.find(x=>t>=x[0]&&t<x[1]);
  if(P){
    const [t0,t1,txt,tg,px,py,red]=P,lines=txt.split('\n'),fs=16;
    const w=Math.max(...lines.map(l=>[...l].length))*fs+22,h=lines.length*(fs+6)+12;
    let cx=px,cy=py,tx=null,ty=null;
    if(tg==='B'){cx=clamp(bx-24-w/2,24+w/2,396-w/2);cy=clamp(by-50-h/2,96+h/2,514-h/2);tx=bx-8;ty=by-10}
    else if(tg){tx=tg[0]-(tg[2]?6*e:0);ty=tg[1]-(tg[2]?26*e:0)}
    if(curPoint!==P){
      curPoint=P;
      $('pTx').innerHTML='';
      lines.forEach((l,i)=>{const ts=el('tspan',{x:0,y:-h/2+6+(fs+6)*i+fs+1},$('pTx'));ts.textContent=l});
      $('pBg').setAttribute('fill',red?'#d83a4f':'#fffbe6');$('pTail').setAttribute('fill',red?'#d83a4f':'#fffbe6');
      $('pTx').setAttribute('fill',red?'#fff':'#3a2a2a');
      $('pBg').setAttribute('x',-w/2);$('pBg').setAttribute('y',-h/2);$('pBg').setAttribute('width',w);$('pBg').setAttribute('height',h);
    }
    const isB=tg==='B',hasT=tx!==null;
    $('pLine').style.display=$('pDot').style.display=hasT&&!isB?'':'none';
    $('pTail').style.display=isB?'':'none';
    if(hasT){
      const lx=tx-cx,ly=ty-cy;
      $('pLine').setAttribute('x1',0);$('pLine').setAttribute('y1',0);$('pLine').setAttribute('x2',lx);$('pLine').setAttribute('y2',ly);
      $('pDot').setAttribute('cx',lx);$('pDot').setAttribute('cy',ly);
      $('pTail').setAttribute('d',`M-9,${h/2-2} L9,${h/2-2} L${lx},${ly} Z`);
    }
    const pop=clamp((t-t0)/.25),fade=clamp((t1-t)/.25);
    $('point').setAttribute('transform',`translate(${cx.toFixed(1)} ${cy.toFixed(1)}) scale(${(.8+.2*pop).toFixed(3)})`);
    $('point').setAttribute('opacity',Math.min(pop,fade));
  }else $('point').setAttribute('opacity',0);

  // まえと あとの がめん
  const io=t<S.introEnd?clamp((S.introEnd-t)/.5):0, oo=clamp((t-S.outroAt)/.5);
  $('ovIntro').style.display=io>0?'flex':'none';$('ovIntro').style.opacity=io;
  $('ovOutro').style.display=oo>0?'flex':'none';$('ovOutro').style.opacity=oo;
  $('endBox').classList.toggle('show',t>=S.outroAt);
  if(!dragging) $('seek').value=t;
  updatePlayBtn();
}

function updatePlayBtn(){
  $('btnPlay').innerHTML=playing?'⏸ とめる':(t>=story.dur?'▶ もういちど':'▶ さいせい');
}
function loop(ts){
  if(!$('player').classList.contains('show')){lastTs=0;return}
  const dt=lastTs?Math.min(.05,(ts-lastTs)/1000):0;lastTs=ts;
  if(playing){
    const prev=t;t=Math.min(story.dur,t+dt*speed);
    if(soundOn) story.sfx.forEach(([tt,n])=>{if(prev<tt&&tt<=t) SFX[n]()});
    if(t>=story.dur) playing=false;
  }
  render();
  requestAnimationFrame(loop);
}

function openStory(id){
  story=STORIES[id];t=0;playing=true;curFace='';curPoint=null;
  $('storyTitle').innerHTML=ruby(story.title);
  $('ovIntro').innerHTML=`<div class="big">${onigiriSVG(story.introFace,120)}</div><p>${ruby(story.intro)}</p>`;
  $('ovOutro').innerHTML=ruby(story.outro).replace('__CHAR__',`<div class="big">${onigiriSVG(story.outroFace,72)}</div>`);
  $('seek').max=story.dur;
  $('btnOther').innerHTML=ruby(story.otherLabel);
  $('menu').classList.remove('show');$('player').classList.add('show');
  window.scrollTo(0,0);
  lastTs=0;requestAnimationFrame(loop);
}

document.querySelectorAll('[data-r]').forEach(n=>{n.innerHTML=ruby(n.dataset.r)});
document.querySelectorAll('.story-btn').forEach(b=>b.addEventListener('click',()=>openStory(b.dataset.story)));
$('btnBack').addEventListener('click',()=>{playing=false;$('player').classList.remove('show');$('menu').classList.add('show');window.scrollTo(0,0)});
$('btnPlay').addEventListener('click',()=>{if(t>=story.dur) t=0;playing=!playing;updatePlayBtn()});
$('btnRestart').addEventListener('click',()=>{t=0;playing=true});
$('btnOther').addEventListener('click',()=>openStory(story.other));
const speedLabel=()=>{$('btnSpeed').innerHTML=speed===1?'🐢 ゆっくりに':'🐇 ふつうに'};

const soundLabel=()=>document.querySelectorAll('.sound-btn').forEach(b=>{b.textContent=soundOn?'🔊 おと:あり':'🔇 おと:なし'});
document.querySelectorAll('.sound-btn').forEach(b=>b.addEventListener('click',()=>{soundOn=!soundOn;if(soundOn){ac();SFX.pop()}soundLabel()}));
$('btnRuby').addEventListener('click',()=>{const off=document.body.classList.toggle('no-ruby');$('btnRuby').textContent=off?'ふりがな:なし':'ふりがな:あり'});
const seek=$('seek');
seek.addEventListener('pointerdown',()=>{dragging=true});
seek.addEventListener('pointerup',()=>{dragging=false});
seek.addEventListener('input',()=>{t=+seek.value;if(t<story.dur&&!playing) updatePlayBtn()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&story) playing=false});
speedLabel();soundLabel();
